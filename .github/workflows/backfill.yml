name: MISHARP backfill

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "시작일 YYYY-MM-DD"
        required: true
        default: "2026-08-01"
      end_date:
        description: "종료일 YYYY-MM-DD"
        required: true
        default: "2026-08-26"
      skip_products:
        description: "상품별 데이터는 건너뛰기"
        type: boolean
        required: true
        default: false
      overwrite_legacy:
        description: "2026-05-31 이전 일일보고 기준값까지 Cafe24로 덮어쓰기 (권장: 체크 안 함)"
        type: boolean
        required: true
        default: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Backfill Cafe24
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SCHEMA: ${{ secrets.DATABASE_SCHEMA }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          CAFE24_MALL_ID: ${{ secrets.CAFE24_MALL_ID }}
          CAFE24_CLIENT_ID: ${{ secrets.CAFE24_CLIENT_ID }}
          CAFE24_CLIENT_SECRET: ${{ secrets.CAFE24_CLIENT_SECRET }}
          CAFE24_REDIRECT_URI: ${{ secrets.CAFE24_REDIRECT_URI }}
          CAFE24_SCOPES: ${{ secrets.CAFE24_SCOPES }}
          CAFE24_API_VERSION: ${{ secrets.CAFE24_API_VERSION }}
          CAFE24_SHOP_NO: ${{ secrets.CAFE24_SHOP_NO }}
        run: |
          ARGS=(--start "${{ inputs.start_date }}" --end "${{ inputs.end_date }}" --skip-google)
          if [ "${{ inputs.skip_products }}" = "true" ]; then
            ARGS+=(--skip-products)
          fi
          if [ "${{ inputs.overwrite_legacy }}" = "true" ]; then
            ARGS+=(--overwrite-legacy)
          fi
          echo "Cafe24 backfill range: ${{ inputs.start_date }} ~ ${{ inputs.end_date }}"
          python -m scripts.backfill_cafe24 "${ARGS[@]}"

      - name: Backfill Google ad cost
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SCHEMA: ${{ secrets.DATABASE_SCHEMA }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          AD_SHEET_ID: ${{ secrets.AD_SHEET_ID }}
          AD_SHEET_GID: ${{ secrets.AD_SHEET_GID }}
          AD_SHEET_DATE_HEADER: ${{ secrets.AD_SHEET_DATE_HEADER }}
          AD_SHEET_COST_HEADER: ${{ secrets.AD_SHEET_COST_HEADER }}
        run: |
          python -m scripts.backfill_google_ads \
            --start "${{ inputs.start_date }}" \
            --end "${{ inputs.end_date }}"
