name: MISHARP Google ad cost backfill

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "시작일 YYYY-MM-DD"
        required: true
        default: "2026-07-01"
      end_date:
        description: "종료일 YYYY-MM-DD"
        required: true
        default: "2026-08-26"

jobs:
  google-backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Backfill Google ad cost only
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SCHEMA: ${{ secrets.DATABASE_SCHEMA }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          AD_SHEET_ID: ${{ secrets.AD_SHEET_ID }}
          AD_SHEET_GID: ${{ secrets.AD_SHEET_GID }}
          AD_SHEET_DATE_HEADER: ${{ secrets.AD_SHEET_DATE_HEADER }}
          AD_SHEET_COST_HEADER: ${{ secrets.AD_SHEET_COST_HEADER }}
        run: |
          python -m scripts.backfill_google_ads \
            --start "${{ inputs.start_date }}" \
            --end "${{ inputs.end_date }}"
